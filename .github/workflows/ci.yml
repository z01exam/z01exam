name: CI

on:
  push:
    branches: [main, refactor-services-independants]
  pull_request:
    branches: [main, refactor-services-independants]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/...

  windows-lock:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -run '^TestFileLock' .

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test_deploy_vps.sh
