name: Deploy to production

# La production suit main : chaque commit de main dont la CI est verte est
# déployé sans intervention. Le lancement manuel redéploie la tête de main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    # L'environnement Production n'est ouvert qu'aux branches protégées ; ses
    # secrets ne sont lisibles que par ce job.
    environment: Production
    steps:
      - name: Resolve commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          # Deux fusions rapprochées : seule la tête de main est déployée,
          # deploy_vps.sh refuserait de toute façon un autre SHA.
          if [ "$RUN_SHA" != "$head" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$RUN_SHA n'est plus la tête de main ($head) : rien à déployer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger VPS deploy
        if: steps.sha.outputs.skip == 'false'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_COMMAND: ${{ secrets.VPS_DEPLOY_COMMAND }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Clé d'hôte épinglée, au format « z01exam-prod <type> <clé> » :
          # pas de ssh-keyscan, qui fait confiance à la première clé reçue.
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::secret VPS_KNOWN_HOSTS absent"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o HostKeyAlias=z01exam-prod \
            -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" \
            "$VPS_DEPLOY_COMMAND" "$DEPLOY_SHA"

      - name: Check live version
        if: steps.sha.outputs.skip == 'false'
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          live="$(curl --fail --silent --show-error --max-time 10 https://z01exam.online/api/version)"
          echo "En ligne : $live"
          case "$live" in
            *"\"sha\":\"$DEPLOY_SHA\""*) echo "Déployé et en ligne : \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::le site public ne sert pas $DEPLOY_SHA"; exit 1 ;;
          esac
